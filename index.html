<!doctype html>
<html lang="en" data-theme="oled" data-accent="blue" data-density="normal">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws://localhost:5173; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://img.youtube.com https://*.googleusercontent.com https://*.ggpht.com https://www.gstatic.com https://cdn-images.dzcdn.net https://files.catbox.moe https://i.imgur.com; media-src 'self' data: blob: https://files.catbox.moe https://i.imgur.com; frame-src https://www.youtube-nocookie.com" />
    <title>Tempo</title>
    <style>
      html[data-theme="oled"]  { --boot-bg: #000000; --boot-fg: 255 255 255 }
      html[data-theme="dark"]  { --boot-bg: #0a0a0a; --boot-fg: 250 250 250 }
      html[data-theme="light"] { --boot-bg: #ffffff; --boot-fg: 9 9 11 }

      html { height: 100%; background: var(--boot-bg); color: rgb(var(--boot-fg)) }
      body { height: 100%; margin: 0 }

      #root { opacity: 0; transition: opacity 240ms ease }
      body.booted #root { opacity: 1 }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        opacity: 1;
        -webkit-app-region: drag;
        transition: opacity 240ms ease;
      }
      #splash.done { opacity: 0; pointer-events: none }

      #splash .mark { position: relative; width: 84px; height: 84px }

      #splash svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        fill: none;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #splash .base { stroke: rgb(var(--boot-fg) / 0.2) }

      #splash .shine {
        stroke: rgb(var(--boot-fg) / 0.95);
        -webkit-mask-image: linear-gradient(100deg, transparent 38%, #000 50%, transparent 62%);
        mask-image: linear-gradient(100deg, transparent 38%, #000 50%, transparent 62%);
        -webkit-mask-size: 260% 100%;
        mask-size: 260% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: splash-sweep 1800ms ease-in-out infinite;
      }

      @keyframes splash-sweep {
        0%   { -webkit-mask-position: 130% 0; mask-position: 130% 0 }
        100% { -webkit-mask-position: -30% 0; mask-position: -30% 0 }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .shine {
          animation: none;
          -webkit-mask-image: none;
          mask-image: none;
          stroke: rgb(var(--boot-fg) / 0.45);
        }
      }
    </style>
    <script src="./boot.js"></script>
  </head>
  <body>
    <div id="splash">
      <div class="mark">
        <svg viewBox="0 0 24 24" class="base" aria-hidden="true">
          <path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/>
          <path d="m7.5 9 3 3-3 3"/>
          <path d="M13 15h3.5"/>
          <path d="M16.5 6.5v3"/>
          <path d="M15 8h3"/>
        </svg>
        <svg viewBox="0 0 24 24" class="shine" aria-hidden="true">
          <path d="M7 3h10a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4Z"/>
          <path d="m7.5 9 3 3-3 3"/>
          <path d="M13 15h3.5"/>
          <path d="M16.5 6.5v3"/>
          <path d="M15 8h3"/>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
